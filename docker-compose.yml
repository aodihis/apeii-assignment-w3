services:
  db:
    image: postgres:16
    container_name: workout-postgres
    environment:
      POSTGRES_USER: psql
      POSTGRES_PASSWORD: letmein
      POSTGRES_DB: workout
    ports:
      - "55432:5432"
    volumes:
      - workout_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: workout-redis
    ports:
      - "6380:6379"
    volumes:
      - workout_redis:/data

volumes:
  workout_db:
  workout_redis: